<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="aliadas: mulheres começando em tecnologia encontram referências próximas, alguns passos à frente." />
    <title>aliadas</title>
    <script>
      // aplica o tema antes de pintar a tela (evita "piscar")
      try {
        var t = localStorage.getItem('aliadas-tema');
        var escuro = t ? t === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (escuro) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
